apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skyflo.engine.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skyflo.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.engine.config.appName | quote }}
  APP_DESCRIPTION: {{ .Values.engine.config.appDescription | quote }}
  DEBUG: {{ .Values.engine.config.debug | quote }}
  API_V1_STR: {{ .Values.engine.config.apiV1Str | quote }}
  LOG_LEVEL: {{ .Values.engine.config.logLevel | quote }}
  RATE_LIMITING_ENABLED: {{ .Values.engine.config.rateLimitingEnabled | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.engine.config.rateLimitPerMinute | quote }}
  JWT_ALGORITHM: {{ .Values.engine.config.jwtAlgorithm | quote }}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.engine.config.jwtAccessTokenExpireMinutes | quote }}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.engine.config.jwtRefreshTokenExpireDays | quote }}
  LLM_MAX_ITERATIONS: {{ .Values.engine.config.llmMaxIterations | quote }}
  MEMORY_ENABLED: {{ .Values.engine.config.memoryEnabled | quote }}
  MEMORY_CONTEXT_MAX_DOCS: {{ .Values.engine.config.memoryContextMaxDocs | quote }}
  MEMORY_CONTEXT_TOKEN_BUDGET: {{ .Values.engine.config.memoryContextTokenBudget | quote }}
  MEMORY_REQUIRE_SOURCE_REFS: {{ .Values.engine.config.memoryRequireSourceRefs | quote }}
  SKYFLO_ENVIRONMENT: {{ .Values.engine.config.environment | quote }}
  MUTATION_CONTROL_ENABLED: {{ .Values.engine.config.mutationControlEnabled | quote }}
  MUTATION_ALLOWED_NAMESPACES: {{ join "," .Values.mcp.rbac.mutationNamespaces | quote }}
  MUTATION_LEASE_SECONDS: {{ .Values.engine.config.mutationLeaseSeconds | quote }}
  MUTATION_VERIFICATION_LEASE_SECONDS: {{ .Values.engine.config.mutationVerificationLeaseSeconds | quote }}
  MUTATION_VERIFICATION_TIMEOUT_SECONDS: {{ .Values.engine.config.mutationVerificationTimeoutSeconds | quote }}
  MUTATION_VERIFICATION_INTERVAL_SECONDS: {{ .Values.engine.config.mutationVerificationIntervalSeconds | quote }}
  MUTATION_RECOVERY_INTERVAL_SECONDS: {{ .Values.engine.config.mutationRecoveryIntervalSeconds | quote }}
  MUTATION_RECOVERY_GRACE_SECONDS: {{ .Values.engine.config.mutationRecoveryGraceSeconds | quote }}
  MUTATION_RECOVERY_BATCH_SIZE: {{ .Values.engine.config.mutationRecoveryBatchSize | quote }}
